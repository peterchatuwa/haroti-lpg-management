# Isolated production stack for Aircargo VPS.
# Does not publish Postgres/Redis on the host. Web is localhost-only.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

name: haroti

services:
  postgres:
    image: postgres:16-alpine
    container_name: haroti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-haroti}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-haroti_lpg}
    volumes:
      - haroti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - haroti_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haroti-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-haroti}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-haroti_lpg}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://lpg.aircargo.mw}
    networks:
      - haroti_net
    # API is only reachable via the web container proxy (no host port)

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haroti-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:18088:80"
    networks:
      - haroti_net

volumes:
  haroti_pg_data:

networks:
  haroti_net:
    name: haroti_net
    driver: bridge

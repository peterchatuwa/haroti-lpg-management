# Production stack for dedicated VPS.
#
#   Port 80  → public marketing website (harotiholdingslimited.com)
#   Port 8080 → ERP web UI + /api proxy (harotiholdingslimited.com:8080)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

name: haroti

services:
  postgres:
    image: postgres:16-alpine
    container_name: haroti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-haroti}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-haroti_lpg}
    volumes:
      - haroti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - haroti_net

  redis:
    image: redis:7-alpine
    container_name: haroti-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - haroti_redis_data:/data
    networks:
      - haroti_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haroti-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-haroti}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-haroti_lpg}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://harotiholdingslimited.com:8080,http://localhost:8080}
    networks:
      - haroti_net
    # API is only reachable via the ERP web container proxy (no host port)

  marketing:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        VITE_ERP_BASE_URL: ${VITE_ERP_BASE_URL:-http://harotiholdingslimited.com:8080}
    container_name: haroti-marketing
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - haroti_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haroti-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks:
      - haroti_net

volumes:
  haroti_pg_data:
  haroti_redis_data:

networks:
  haroti_net:
    name: haroti_net
    driver: bridge

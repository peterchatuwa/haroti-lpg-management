# Production stack for dedicated VPS.
#
#   Caddy (host)     → HTTPS :443 / HTTP :80
#   marketing :9080  → public website
#   web :9081        → ERP at /erp/ + API at /api/
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build

name: haroti

services:
  postgres:
    image: postgres:16-alpine
    container_name: haroti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-haroti}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-haroti_lpg}
    volumes:
      - haroti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - haroti_net

  redis:
    image: redis:7-alpine
    container_name: haroti-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - haroti_redis_data:/data
    networks:
      - haroti_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haroti-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-haroti}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-haroti_lpg}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://harotiholdingslimited.com,http://harotiholdingslimited.com}
      ERP_PUBLIC_URL: ${ERP_PUBLIC_URL:-https://harotiholdingslimited.com/erp}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASS: ${EMAIL_SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Haroti Gas ERP <noreply@harotiholdingslimited.com>}
      PAYCHANGU_CLIENT_ID: ${PAYCHANGU_CLIENT_ID:-}
      PAYCHANGU_API_KEY: ${PAYCHANGU_API_KEY:-}
      PAYCHANGU_SECRET_KEY: ${PAYCHANGU_SECRET_KEY:-}
      PAYCHANGU_BASE_URL: ${PAYCHANGU_BASE_URL:-https://api.paychangu.com}
      PAYCHANGU_WEBHOOK_SECRET: ${PAYCHANGU_WEBHOOK_SECRET:-}
      PAYCHANGU_CALLBACK_URL: ${PAYCHANGU_CALLBACK_URL:-https://harotiholdingslimited.com/api/paychangu/webhook}
      PAYCHANGU_CARD_REDIRECT_URL: ${PAYCHANGU_CARD_REDIRECT_URL:-https://harotiholdingslimited.com/erp/pos}
      ZHONGYI_API_URL: ${ZHONGYI_API_URL:-http://en.energy.zhongyismart.com/api/commonInternal.jsp}
      ZHONGYI_USERNAME: ${ZHONGYI_USERNAME:-}
      ZHONGYI_PASSWORD: ${ZHONGYI_PASSWORD:-}
      ZHONGYI_AREA_ID: ${ZHONGYI_AREA_ID:-}
      ZHONGYI_EQUIPMENT_MODEL_ID: ${ZHONGYI_EQUIPMENT_MODEL_ID:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    networks:
      - haroti_net
    # API is only reachable via the ERP web container proxy (no host port)

  marketing:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        VITE_ERP_BASE_URL: ${VITE_ERP_BASE_URL:-https://harotiholdingslimited.com/erp}
    container_name: haroti-marketing
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:80"
    networks:
      - haroti_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/erp/}
    container_name: haroti-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:9081:80"
    networks:
      - haroti_net

volumes:
  haroti_pg_data:
  haroti_redis_data:

networks:
  haroti_net:
    name: haroti_net
    driver: bridge

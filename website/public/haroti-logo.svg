<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
  <defs>
    <!-- Define the green color -->
    <linearGradient id="greenFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B7A5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F6B4F;stop-opacity:1" />
    </linearGradient>
    <!-- Define the blue color -->
    <linearGradient id="blueFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Green flame (left) -->
  <path d="M 80 15 Q 75 25, 75 35 Q 75 50, 85 60 Q 90 65, 95 60 Q 105 50, 105 35 Q 105 25, 100 15 Q 95 20, 90 25 Q 85 20, 80 15 Z" 
        fill="url(#greenFlame)" stroke="#0F6B4F" stroke-width="1"/>
  
  <!-- Blue flame (right) -->
  <path d="M 105 10 Q 100 20, 100 32 Q 100 48, 112 58 Q 118 63, 125 58 Q 137 48, 137 32 Q 137 20, 132 10 Q 127 16, 120 22 Q 115 16, 105 10 Z" 
        fill="url(#blueFlame)" stroke="#1E3A8A" stroke-width="1"/>
  
  <!-- White highlights on flames -->
  <ellipse cx="88" cy="35" rx="4" ry="8" fill="white" opacity="0.3"/>
  <ellipse cx="118" cy="32" rx="4" ry="8" fill="white" opacity="0.3"/>
  
  <!-- HAROTI GAS text -->
  <text x="150" y="50" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#0F6B4F" letter-spacing="2">HAROTI GAS</text>
  
  <!-- Powering the world tagline -->
  <rect x="150" y="60" width="140" height="22" rx="11" fill="#1E3A8A"/>
  <text x="220" y="75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Powering the world</text>
</svg>
